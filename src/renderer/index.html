<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- img-src allows https: (in addition to 'self' data: file:) so podcast
     artwork from the Add Podcast search can load — those come from whatever
     CDN each podcast's own host happens to use (megaphone.imgix.net, etc.),
     a different one per result, so there's no fixed set of hosts to
     allowlist instead. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file: https:; media-src 'self' file:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Light Phone Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="resize-edge resize-top"></div>
<div class="resize-edge resize-bottom"></div>
<div class="resize-edge resize-left"></div>
<div class="resize-edge resize-right"></div>
<div class="resize-corner resize-tl"></div>
<div class="resize-corner resize-tr"></div>
<div class="resize-corner resize-bl"></div>
<div class="resize-corner resize-br"></div>
<script src="app.js"></script>
</body>
</html>
